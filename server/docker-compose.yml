services:
  # =========================
  # PostgreSQL
  # =========================
  postgres:
    image: postgres:17-alpine
    container_name: vybe-postgres
    restart: unless-stopped

    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: vybe

    ports:
      - "5432:5432"

    volumes:
      - postgres_data:/var/lib/postgresql/data

    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d vybe"]
      interval: 5s
      timeout: 5s
      retries: 5


  # =========================
  # Redis
  # =========================
  redis:
    image: redis:8-alpine
    container_name: vybe-redis
    restart: unless-stopped

    ports:
      - "6379:6379"

    volumes:
      - redis_data:/data

    command: redis-server --appendonly yes

    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5


  # =========================
  # API
  # =========================
  api:
    image: vybe:local

    build:
      context: .
      dockerfile: Dockerfile

    container_name: vybe-api
    restart: unless-stopped

    env_file:
      - .env.docker

    ports:
      - "3000:3000"

    depends_on:
      postgres:
        condition: service_healthy

      redis:
        condition: service_healthy

    command:
      - node
      - dist/server.js


  # =========================
  # Queue Reconciliation Worker
  # =========================
  reconciliation-worker:
    image: vybe:local

    container_name: vybe-reconciliation-worker
    restart: unless-stopped

    env_file:
      - .env.docker

    depends_on:
      postgres:
        condition: service_healthy

      redis:
        condition: service_healthy

    command:
      - node
      - dist/reconciliation-worker.js


  # =========================
  # Presence Worker
  # =========================
  presence-worker:
    image: vybe:local

    container_name: vybe-presence-worker
    restart: unless-stopped

    env_file:
      - .env.docker

    depends_on:
      postgres:
        condition: service_healthy

      redis:
        condition: service_healthy

    command:
      - node
      - dist/presence-worker.js


  # =========================
  # Custom Track Worker
  # =========================
  # This worker is not required 24/7.
  #
  # Start it only when you need to process
  # admin-uploaded custom tracks.
  # =========================
  custom-track-worker:
    image: vybe:local

    container_name: vybe-custom-track-worker
    restart: "no"

    env_file:
      - .env.docker

    depends_on:
      postgres:
        condition: service_healthy

      redis:
        condition: service_healthy

    command:
      - node
      - dist/custom-track-worker.js

    profiles:
      - custom-worker


# =========================
# Persistent Volumes
# =========================
volumes:
  postgres_data:
  redis_data: